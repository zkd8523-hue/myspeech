<title>My Speech</title>
<style>
  :root{--ink:#141D2B;--ink2:#48566B;--ink3:#8091A6;
        --line:rgba(20,29,43,.10);--ground:#F8FAFD;--surface:#fff;--accent:#1B57CF}
  @media (prefers-color-scheme:dark){
    :root{--ink:#E8EDF6;--ink2:#A9B6C9;--ink3:#7A8799;
          --line:rgba(255,255,255,.10);--ground:#0F1522;--surface:#151D2C;--accent:#7FA6F0}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);line-height:1.75;
       font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif}
  .wrap{max-width:640px;margin:0 auto;padding:64px 22px 80px}
  .mark{width:64px;height:64px;border-radius:16px;background:var(--accent);
        display:grid;place-items:center;margin-bottom:22px}
  .mark svg{width:34px;height:34px}
  h1{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:0 0 8px}
  .tag{color:var(--ink3);font-size:14px;margin:0 0 36px}
  p{color:var(--ink2);font-size:15px}
  ul{list-style:none;padding:0;margin:28px 0 0;display:flex;flex-direction:column;gap:10px}
  a.item{display:flex;align-items:center;justify-content:space-between;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;text-decoration:none;color:var(--ink);font-weight:700;font-size:15px}
  a.item span{color:var(--ink3);font-weight:400}
  footer{margin-top:44px;padding-top:22px;border-top:1px solid var(--line);
         color:var(--ink3);font-size:13px}
  footer a{color:var(--accent)}
</style>
</head>
